allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  re2: set this to true or false
# Keep host-native binaries for builds and Linux ARM64 binaries for Lambda.
permissions:
  payload:
    skills: true
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc
